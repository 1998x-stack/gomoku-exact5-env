[metadata]
license_files = LICENSE

[options]
packages = find:
package_dir =
    = src
include_package_data = True

[options.packages.find]
where = src

[tool.pytest.ini_options]
addopts = "-q --maxfail=1"

[flake8]
max-line-length = 100
extend-ignore = E203,W503

[mypy]
python_version = 3.9
ignore_missing_imports = True
warn_unused_ignores = True
strict_optional = True
